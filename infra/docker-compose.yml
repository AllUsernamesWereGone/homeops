name: homeops

services:
  homeops-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: homeops-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - homeops-net

  homeops-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: homeops-frontend
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:80"
    depends_on:
      - homeops-backend
    networks:
      - homeops-net

networks:
  homeops-net:
    name: homeops-net