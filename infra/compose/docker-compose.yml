name: homeops

services:
  homeops-backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: homeops-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker, generateData
      HOMEOPS_DB_PATH: /data/homeops-db
      HOMEOPS_LOG_FILE: /logs/backend.log
      HOMEOPS_MQTT_ENABLED: "true"
      HOMEOPS_MQTT_BROKER_URL: tcp://homeops-mqtt:1883
    volumes:
      - homeops-backend-data:/data
      - homeops-backend-logs:/logs
    expose:
      - "8080"
    depends_on:
      homeops-mqtt:
        condition: service_started
    networks:
      - homeops-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  homeops-frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: homeops-frontend
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:80"
    depends_on:
      homeops-backend:
        condition: service_started
    networks:
      - homeops-net

  homeops-mqtt:
    image: eclipse-mosquitto:2
    container_name: homeops-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_IP:-0.0.0.0}:1883:1883"
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - homeops-mqtt-data:/mosquitto/data
      - homeops-mqtt-log:/mosquitto/log
    networks:
      - homeops-net

volumes:
  homeops-backend-data:
  homeops-backend-logs:
  homeops-mqtt-data:
  homeops-mqtt-log:

networks:
  homeops-net:
    name: homeops-net
