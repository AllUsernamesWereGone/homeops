name: homeops

services:
  homeops-backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: homeops-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - homeops-net

  homeops-frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: homeops-frontend
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:8080:80"
    depends_on:
      - homeops-backend
    networks:
      - homeops-net

  homeops-mqtt:
    image: eclipse-mosquitto:2
    container_name: homeops-mqtt
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - homeops-mqtt-data:/mosquitto/data
      - homeops-mqtt-log:/mosquitto/log
    networks:
      - homeops-net

volumes:
  homeops-mqtt-data:
  homeops-mqtt-log:

networks:
  homeops-net:
    name: homeops-net