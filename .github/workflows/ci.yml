name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest #temporary github linux VM

    defaults:
      run:
        working-directory: apps/backend

    steps:
      #downloads repo into github runner
      - name: Checkout repository
        uses: actions/checkout@v7

      - run: echo "Backend"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven #cache maven, so next run is faster
          cache-dependency-path: apps/backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test #can be adjusted to do more later

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - run: echo "Frontend"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --configuration production

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - run: echo "Docker"

      - name: Build backend Docker image
        run: docker build -t homeops-backend:ci ./apps/backend

      - name: Build frontend Docker image
        run: docker build -t homeops-frontend:ci ./apps/frontend
