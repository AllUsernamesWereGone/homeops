spring:
  datasource:
    url: jdbc:h2:file:${HOMEOPS_DB_PATH:/data/homeops-db};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ${HOMEOPS_DB_USER:sa}
    password: ${HOMEOPS_DB_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  file.name: ${HOMEOPS_LOG_FILE:/logs/backend.log}
  level:
    root: INFO
    dev.homeops.backend: INFO
    org.springframework.web: INFO

homeops:
  mqtt:
    enabled: ${HOMEOPS_MQTT_ENABLED:true}
    broker-url: ${HOMEOPS_MQTT_BROKER_URL:tcp://homeops-mqtt:1883}
    client-id: ${HOMEOPS_MQTT_CLIENT_ID:homeops-backend}
    topic-prefix: ${HOMEOPS_MQTT_TOPIC_PREFIX:homeops}
