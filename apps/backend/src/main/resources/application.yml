spring:
  datasource:
    url: jdbc:h2:file:${HOMEOPS_DB_PATH:./database/db};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ${HOMEOPS_DB_USER:sa}
    password: ${HOMEOPS_DB_PASSWORD:}
  jpa:
    # Set this property to true if you want to see the executed queries
    show-sql: false
    hibernate:
      ddl-auto: update
    # Allows to fetch lazy properties outside of the original transaction. Although this sounds helpful, the property
    # is disabled since it breaks the principle of least astonishment and leads to bad performance. To learn more,
    # follow this link: https://bit.ly/2LaX9ku
    open-in-view: false
  application:
    name: homeops-backend
  devtools:
    restart:
      enabled: false

app:
  version: 0.0.1-SNAPSHOT

logging:
  file.name: ${HOMEOPS_LOG_FILE:./logs/backend.log}
  level:
    root: INFO
    dev.homeops.backend: INFO
    org.springframework.web: INFO
  pattern:
    level: r=%X{r} ip=%X{ip} u=%X{u} %5p

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
