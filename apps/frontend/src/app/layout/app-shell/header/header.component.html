<header class="app-header">
  <a routerLink="/" class="brand">
    <span class="brand-mark">H</span>

    <span class="brand-text">
      <strong>HomeOps</strong>
      <small>Infrastructure Lab</small>
    </span>
  </a>

  <div class="header-spacer"></div>

  <span
    class="system-pill"
    [class.system-pill--checking]="backendUp() === null"
    [class.system-pill--online]="backendUp()"
    [class.system-pill--offline]="!backendUp()"
    [title]="healthTitle()"
  >
    {{ healthLabel() }}
  </span>
</header>
